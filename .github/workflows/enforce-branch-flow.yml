name: Enforce branch flow

on:
  pull_request:
    branches: [deployed]

jobs:
  check-source:
    name: Only allow merges from main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "main" ]; then
            echo "Error: only 'main' can be merged into 'deployed' (got '${{ github.head_ref }}')"
            exit 1
          fi